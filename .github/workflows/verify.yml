name: Comic Creator Pro checks

on:
  push:
    branches:
      - feat/comic-platform-foundation
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm install
      - name: Run provider routing tests
        run: npm test
      - name: Build application
        run: npm run build
